services:
  - type: web
    name: a2a-invoice-agent-tds-ga3
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DB_PATH
        value: data/agent.sqlite3
      - key: DATABASE_URL
        sync: false
